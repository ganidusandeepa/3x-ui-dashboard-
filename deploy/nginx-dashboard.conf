# ---------------------------------------------------------------------------
# nginx reverse proxy for the 3x-ui dashboard.
#
# Use this when your VPS already serves the 3x-ui panel on ports 80/443 (so
# Coolify's own proxy can't own them) but you still want a clean HTTPS domain
# like https://dashboard.trackydev.site instead of an IP:port URL.
#
# Flow:  browser --(443, TLS)--> nginx --(HTTP)--> dashboard container on 127.0.0.1:8090
#
# Prerequisites
#   1. DNS: A record  dashboard.trackydev.site -> your VPS public IP
#   2. Publish the dashboard container on a LOCAL host port via Coolify:
#        App -> Configuration -> Network -> Ports Mappings:  127.0.0.1:8090:8080
#      Binding to 127.0.0.1 keeps it private — only nginx can reach it, so you
#      do NOT need to open 8090 in the firewall / Oracle Security List.
#   3. Install: sudo apt install nginx certbot python3-certbot-nginx
#
# Install
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/dashboard.conf
#   sudo ln -s /etc/nginx/sites-available/dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.trackydev.site   # issues + wires up TLS
# ---------------------------------------------------------------------------

# Where the dashboard container is published (Coolify Ports Mapping host side).
upstream xui_dashboard {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.trackydev.site;

    # certbot will add the TLS listener + a redirect here automatically.
    # Until then this plain-HTTP block is enough to validate and serve.

    # Allow large uploads (e.g. importDB) through the proxy.
    client_max_body_size 64m;

    location / {
        proxy_pass http://xui_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events support (/api/stream, /public/stream) ---
        # SSE breaks if nginx buffers or reuses a keep-alive Connection header.
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_cache                        off;
        chunked_transfer_encoding          off;
        proxy_read_timeout                 3600s;
        proxy_send_timeout                 3600s;
    }
}
